<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Butter Bureau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "Nyght Serif";
    src: url("./uploads/NyghtSerif-Light.otf") format("opentype");
    font-weight: 300;
    font-style: normal;
    font-display: swap;
  }
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; width: 100%; }
  * { box-sizing: border-box; }
  @media (pointer: fine) {
    .om-stage { cursor: none; }
  }
  .headline {
    font-family: "Nyght Serif", serif;
    font-weight: 300;
    color: #fff;
    font-size: clamp(48px, 12vw, 220px);
    white-space: nowrap;
    text-align: center;
    text-decoration-line: underline;
    text-decoration-thickness: 2px;
  }
  .headline.line1 { line-height: 0.98; }
  .headline.line2 { line-height: 0.65; letter-spacing: -0.01em; }
</style>
</head>
<body>
<div class="om-stage" style="position:relative; width:100vw; height:100vh; background:#000E74; overflow:hidden; font-family:'Oswald',sans-serif;">

  <div id="toast" style="position:absolute; left:9vw; bottom:8vh; width:19vw; aspect-ratio:1/1; will-change:transform; z-index:15;">
    <img src="./uploads/BackgroundEraser_20250605_092922575.png" alt="Toast with heart-shaped butter" style="width:100%; height:100%; object-fit:contain; display:block;">
  </div>

  <div id="knife" style="position:fixed; top:0; left:0; width:2.5vw; aspect-ratio:172/1230; pointer-events:none; will-change:transform; z-index:20;">
    <img src="./uploads/knife-cursor.png" alt="Knife" style="width:100%; height:100%; object-fit:contain; display:block; filter:drop-shadow(0 6px 14px rgba(0,0,0,0.35));">
  </div>

  <a href="https://app.notion.com/p/BUTTER-3a88c452a53e8013b923cd25ebd0118b?source=copy_link" target="_blank" rel="noopener" style="text-decoration:none; color:inherit; display:block;">
    <div class="headline line1" style="padding-top:400px; font-size:200px;">ЗАБИРАЙ СВІЙ</div>
  </a>
  <div class="headline line2" style="padding-top:0px; padding-bottom:0px; font-size:200px;">РУБИКАТОР</div>
</div>

<script>
(function () {
  var knife = document.getElementById('knife');
  var toast = document.getElementById('toast');
  var pointer = { x: window.innerWidth * 0.62, y: window.innerHeight * 0.7 };
  var pos = { x: pointer.x, y: pointer.y };
  var toastHome = null, toastPos = null;
  var toastVel = { x: 0, y: 0 };
  var toastSize = { w: 0, h: 0 };

  var knifeEase = 0.17;
  var fleeRadius = 320;
  var fleeSpeed = 530;
  var minGap = 130;

  function onMove(e) { pointer.x = e.clientX; pointer.y = e.clientY; }
  function onTouch(e) {
    var t = e.touches[0];
    if (t) { pointer.x = t.clientX; pointer.y = t.clientY; }
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('touchmove', onTouch, { passive: true });

  function initToast() {
    var r = toast.getBoundingClientRect();
    toastHome = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    toastPos = { x: toastHome.x, y: toastHome.y };
    toastSize = { w: r.width, h: r.height };
  }
  initToast();
  window.addEventListener('resize', initToast);

  function tick() {
    var dx = pointer.x - pos.x;
    var dy = pointer.y - pos.y;
    pos.x += dx * knifeEase;
    pos.y += dy * knifeEase;
    knife.style.transform = 'translate(' + pos.x + 'px, ' + pos.y + 'px) translate(-46%, -68%)';

    if (toastHome && toastPos) {
      var dx2 = toastPos.x - pos.x;
      var dy2 = toastPos.y - pos.y;
      var dist = Math.hypot(dx2, dy2) || 1;

      if (dist < fleeRadius) {
        var push = Math.pow((fleeRadius - dist) / fleeRadius, 0.4);
        toastVel.x += (dx2 / dist) * push * fleeSpeed * 0.06;
        toastVel.y += (dy2 / dist) * push * fleeSpeed * 0.06;
      }
      if (dist < minGap) {
        var overlap = minGap - dist;
        toastVel.x += (dx2 / dist) * overlap * 0.04;
        toastVel.y += (dy2 / dist) * overlap * 0.04;
        pos.x -= (dx2 / dist) * overlap * 0.5;
        pos.y -= (dy2 / dist) * overlap * 0.5;
      }
      toastVel.x *= 0.85;
      toastVel.y *= 0.85;
      toastPos.x += toastVel.x;
      toastPos.y += toastVel.y;

      var marginX = Math.max(toastSize.w * 0.5 + 20, window.innerWidth * 0.05);
      var marginY = Math.max(toastSize.h * 0.5 + 20, window.innerHeight * 0.05);
      var minX = marginX, maxX = window.innerWidth - marginX;
      var minY = marginY, maxY = window.innerHeight - marginY;
      if (toastPos.x < minX) { toastPos.x = minX; toastVel.x = Math.abs(toastVel.x) * 0.6; }
      if (toastPos.x > maxX) { toastPos.x = maxX; toastVel.x = -Math.abs(toastVel.x) * 0.6; }
      if (toastPos.y < minY) { toastPos.y = minY; toastVel.y = Math.abs(toastVel.y) * 0.6; }
      if (toastPos.y > maxY) { toastPos.y = maxY; toastVel.y = -Math.abs(toastVel.y) * 0.6; }

      var offX = toastPos.x - toastHome.x;
      var offY = toastPos.y - toastHome.y;
      var tilt = Math.max(-12, Math.min(12, toastVel.x * 1.5));
      toast.style.transform = 'translate(' + offX.toFixed(2) + 'px, ' + offY.toFixed(2) + 'px) rotate(' + tilt.toFixed(2) + 'deg)';
    }

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
